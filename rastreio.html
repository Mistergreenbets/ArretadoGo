<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Pedido - ArretadoGo</title>
    <link rel="icon" type="image/png" href="logo.png?v=1">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background: var(--light-bg, #F5F5F5); }

        .rastreio-container {
            max-width: 560px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        .rastreio-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .rastreio-header img { height: 40px; }

        .rastreio-card {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        .rastreio-codigo {
            font-size: 13px;
            color: #888;
            margin-bottom: 4px;
        }

        .rastreio-titulo {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* ---- Timeline de status ---- */
        .timeline {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 30px 0 10px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            height: 3px;
            background: #eee;
            z-index: 0;
        }

        .timeline-step {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .timeline-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }

        .timeline-step.concluido .timeline-dot {
            background: var(--primary-color, #C20000);
            color: #fff;
        }

        .timeline-step.atual .timeline-dot {
            background: var(--primary-color, #C20000);
            color: #fff;
            box-shadow: 0 0 0 5px rgba(194, 0, 0, 0.15);
        }

        .timeline-label {
            font-size: 11px;
            text-align: center;
            color: #999;
            max-width: 70px;
        }

        .timeline-step.concluido .timeline-label,
        .timeline-step.atual .timeline-label {
            color: #222;
            font-weight: 600;
        }

        .status-cancelado-box {
            background: #FDECEA;
            color: #B91C1C;
            padding: 14px 16px;
            border-radius: 10px;
            font-weight: 600;
            text-align: center;
        }

        .rastreio-itens {
            margin-top: 16px;
            font-size: 14px;
            color: #444;
            line-height: 1.7;
        }

        .rastreio-total {
            margin-top: 10px;
            font-weight: 700;
            font-size: 16px;
        }

        #mapaMotoboy {
            width: 100%;
            height: 260px;
            border-radius: 12px;
            margin-top: 8px;
        }

        .notif-btn {
            width: 100%;
            margin-top: 4px;
        }

        .erro-box {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="rastreio-container">
        <div class="rastreio-header">
            <img src="logo.png?v=1" alt="ArretadoGo">
            <strong>Acompanhar Pedido</strong>
        </div>

        <div id="conteudoRastreio">
            <div class="erro-box">Carregando pedido... ⏳</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="firebase-config.js"></script>
    <script src="rastreio.js"></script>
</body>
</html>
