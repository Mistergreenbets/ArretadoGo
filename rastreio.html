<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Pedido - ArretadoGo</title>
    <link rel="icon" type="image/png" href="favicon.png?v=1">
    <link rel="icon" href="favicon.ico?v=1" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background: var(--light-bg, #F5F5F5); }

        .rastreio-container {
            max-width: 560px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        .rastreio-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .rastreio-header img { height: 40px; }

        .rastreio-card {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        .rastreio-codigo {
            font-size: 13px;
            color: #888;
            margin-bottom: 4px;
        }

        .rastreio-titulo {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* ---- Timeline de status ---- */
        .timeline {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 30px 0 10px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            height: 3px;
            background: #eee;
            z-index: 0;
        }

        .timeline-step {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .timeline-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            margin-bottom: 8px;
            transition: all 0.3s ease;
        }

        .timeline-step.concluido .timeline-dot {
            background: var(--primary-color, #C20000);
            color: #fff;
        }

        .timeline-step.atual .timeline-dot {
            background: var(--primary-color, #C20000);
            color: #fff;
            box-shadow: 0 0 0 5px rgba(194, 0, 0, 0.15);
        }

        .timeline-label {
            font-size: 11px;
            text-align: center;
            color: #999;
            max-width: 70px;
        }

        .timeline-step.concluido .timeline-label,
        .timeline-step.atual .timeline-label {
            color: #222;
            font-weight: 600;
        }

        .status-cancelado-box {
            background: #FDECEA;
            color: #B91C1C;
            padding: 14px 16px;
            border-radius: 10px;
            font-weight: 600;
            text-align: center;
        }

        /* ---- Previsão de entrega/retirada ---- */
        .previsao-box {
            background: var(--light-bg, #F5F5F5);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin: 18px 0;
        }

        .previsao-box:empty {
            display: none;
            margin: 0;
        }

        .previsao-box.previsao-concluida {
            background: #D4EDDA;
            color: #155724;
        }

        .previsao-hora {
            font-size: 12px;
            font-weight: 500;
            color: #888;
        }

        .previsao-concluida .previsao-hora {
            display: none;
        }

        /* ---- Mapa do motoboy ---- */
        #mapaMotoboy {
            width: 100%;
            height: 260px;
            border-radius: 12px;
            margin-top: 8px;
        }

        .mapa-legenda {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }

        /* ---- Detalhes do pedido (itens, endereço, observações, total) ---- */
        .rastreio-secao {
            border-top: 1px solid #eee;
            padding-top: 16px;
            margin-top: 16px;
        }

        .rastreio-secao-titulo {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #999;
            margin-bottom: 10px;
        }

        .rastreio-itens-lista {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .rastreio-item-linha {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 14px;
        }

        .rastreio-item-qtd {
            font-weight: 700;
            color: var(--primary-color, #C20000);
            flex-shrink: 0;
        }

        .rastreio-item-nome {
            flex: 1;
            font-weight: 600;
            color: #222;
        }

        .rastreio-item-preco {
            color: #888;
            font-size: 13px;
            flex-shrink: 0;
        }

        .rastreio-item-extras {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
            margin-left: 28px;
        }

        .rastreio-endereco,
        .rastreio-obs {
            font-size: 14px;
            line-height: 1.5;
            color: #333;
        }

        .rastreio-vazio {
            font-size: 13px;
            color: #999;
        }

        .rastreio-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #eee;
            margin-top: 18px;
            padding-top: 14px;
            font-size: 16px;
        }

        .rastreio-total-row strong {
            font-size: 20px;
            color: var(--primary-color, #C20000);
        }

        .erro-box {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="rastreio-container">
        <div class="rastreio-header">
            <img src="logo.png?v=1" alt="ArretadoGo">
            <strong>Acompanhar Pedido</strong>
        </div>

        <div id="conteudoRastreio">
            <div class="erro-box">Carregando pedido... ⏳</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="firebase-config.js"></script>
    <script src="rastreio.js"></script>
</body>
</html>
