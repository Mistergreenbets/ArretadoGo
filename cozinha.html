<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Cozinha - ArretadoGo</title>
    <link rel="icon" type="image/png" href="favicon.png?v=1">
    <style>
        /* ==========================================================================
           Tela da cozinha é uma tela própria (Kitchen Display System): fica ligada
           o dia inteiro numa bancada, geralmente longe de quem olha, então usa tema
           escuro (menos ofuscante que branco sob luz de cozinha) com texto grande e
           alto contraste. Por isso este arquivo NÃO depende de admin-style.css —
           reusar as classes do painel administrativo (pensado pra tela de escritório,
           tema claro) foi o que causava a mistura sem estrutura e sem contraste.
           Tudo aqui usa o prefixo "kds-" (Kitchen Display System) pra nunca colidir
           com nada de admin-style.css, caso ele seja carregado em algum momento.
           ========================================================================== */
        :root {
            --kds-bg: #121212;
            --kds-bg-elevado: #1a1a1a;
            --kds-card: #1e1e1e;
            --kds-card-header: #262626;
            --kds-borda: #333;
            --kds-texto: #f5f5f5;
            --kds-texto-fraco: #a3a3a3;
            --kds-vermelho: #C20000;
            --kds-amarelo: #f59e0b;
            --kds-azul: #3b82f6;
            --kds-verde: #10b981;
            --kds-vermelho-alerta: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--kds-bg);
            color: var(--kds-texto);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* ---------- TELA DE LOGIN ---------- */
        .kds-login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 20% 20%, rgba(194,0,0,0.15), transparent 45%),
                var(--kds-bg);
        }

        .kds-login-box {
            width: 100%;
            max-width: 380px;
            background: var(--kds-card);
            border: 1px solid var(--kds-borda);
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
            text-align: center;
        }

        .kds-login-box img.kds-logo {
            height: 56px;
            margin-bottom: 12px;
        }

        .kds-login-subtitulo {
            color: var(--kds-texto-fraco);
            font-size: 14px;
            margin: 0 0 24px 0;
            line-height: 1.4;
        }

        .kds-form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .kds-form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--kds-texto-fraco);
            margin-bottom: 6px;
        }

        .kds-input {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid var(--kds-borda);
            background: var(--kds-bg-elevado);
            color: var(--kds-texto);
        }

        .kds-input:focus {
            outline: none;
            border-color: var(--kds-vermelho);
        }

        .kds-erro {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--kds-vermelho-alerta);
            color: #fca5a5;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: left;
        }

        .kds-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: filter 0.15s, transform 0.05s;
        }

        .kds-btn:active { transform: scale(0.98); }
        .kds-btn:hover { filter: brightness(1.1); }

        .kds-btn-primaria {
            background: var(--kds-vermelho);
            color: #fff;
        }

        /* ---------- ESTRUTURA PRINCIPAL ---------- */
        .kds-app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .kds-topbar {
            background: #000;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            border-bottom: 3px solid var(--kds-vermelho);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .kds-topbar-marca {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .kds-topbar img.kds-logo {
            height: 34px;
        }

        .kds-topbar h1 {
            font-size: 19px;
            margin: 0;
            color: #fff;
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        .kds-topbar-sub {
            font-size: 12px;
            color: var(--kds-texto-fraco);
            margin-top: 2px;
        }

        .kds-topbar-acoes {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .kds-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--kds-bg-elevado);
            border: 1px solid var(--kds-borda);
            color: var(--kds-texto);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        .kds-btn-acao {
            background: var(--kds-bg-elevado);
            border: 1px solid var(--kds-borda);
            color: var(--kds-texto);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .kds-btn-acao:hover { border-color: var(--kds-vermelho); }
        .kds-btn-acao.kds-ativo { background: var(--kds-vermelho); border-color: var(--kds-vermelho); color: #fff; }

        .kds-btn-sair {
            background: transparent;
            border: 1px solid var(--kds-vermelho-alerta);
            color: #fca5a5;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .kds-btn-sair:hover { background: rgba(239, 68, 68, 0.12); }

        /* ---------- CONTEÚDO ---------- */
        .kds-container {
            padding: 20px 24px 40px;
            max-width: 1700px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        .kds-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }

        .kds-toolbar h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
        }

        .kds-contador {
            font-weight: 800;
            font-size: 14px;
            color: #000;
            background: var(--kds-amarelo);
            padding: 8px 16px;
            border-radius: 999px;
        }

        .kds-orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .kds-vazio {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--kds-texto-fraco);
        }

        .kds-vazio h3 { color: var(--kds-texto); font-size: 22px; margin: 0; }

        /* ---------- CARD DE PEDIDO ---------- */
        .kds-card {
            background: var(--kds-card);
            border-radius: 12px;
            border: 2px solid var(--kds-borda);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .kds-card.kds-status-pendente { border-color: var(--kds-amarelo); }
        .kds-card.kds-status-preparando { border-color: var(--kds-azul); }

        .kds-card-header {
            background: var(--kds-card-header);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--kds-borda);
        }

        .kds-order-numero {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
        }

        .kds-order-timer {
            font-size: 14px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
        }

        .kds-timer-alerta {
            background: var(--kds-vermelho-alerta);
            color: #fff;
            animation: kds-pulse 1.5s infinite;
        }

        @keyframes kds-pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .kds-card-body { padding: 16px; flex: 1; }

        .kds-tipo-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .kds-tipo-delivery { background: #1e3a8a; color: #93c5fd; }
        .kds-tipo-retirada { background: #065f46; color: #a7f3d0; }

        .kds-itens-lista { list-style: none; padding: 0; margin: 0 0 12px 0; }

        .kds-item-row { padding: 10px 0; border-bottom: 1px dashed var(--kds-borda); }
        .kds-item-row:last-child { border-bottom: none; }

        .kds-item-principal {
            display: flex;
            align-items: baseline;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
        }

        .kds-item-qtd {
            background: var(--kds-vermelho);
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 16px;
            flex-shrink: 0;
        }

        .kds-item-detalhes {
            margin-top: 6px;
            padding-left: 36px;
            font-size: 14px;
            color: #ccc;
        }

        .kds-item-obs {
            background: rgba(239, 68, 68, 0.18);
            border-left: 3px solid var(--kds-vermelho-alerta);
            color: #fca5a5;
            padding: 6px 10px;
            margin-top: 6px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
        }

        .kds-card-footer {
            padding: 12px 16px;
            background: #181818;
            border-top: 1px solid var(--kds-borda);
        }

        .kds-btn-kitchen {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .kds-btn-iniciar { background: var(--kds-amarelo); color: #000; }
        .kds-btn-iniciar:hover { background: #d97706; }

        .kds-btn-pronto { background: var(--kds-verde); color: #fff; }
        .kds-btn-pronto:hover { background: #059669; }

        .kds-btn-imprimir {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid var(--kds-borda);
            border-radius: 8px;
            cursor: pointer;
            background: var(--kds-bg-elevado);
            color: var(--kds-texto);
        }
        .kds-btn-imprimir:hover { border-color: var(--kds-vermelho); }

        /* ---------- RECIBO DE IMPRESSÃO ---------- */
        /* Fica invisível durante o uso normal da tela. Na hora de imprimir, o JS
           preenche #reciboConteudo e chama window.print() — o @media print abaixo
           esconde tudo o resto da página e mostra só o recibo, formatado como uma
           comanda de impressora térmica (monoespaçado, largura fixa). */
        @media screen {
            .kds-recibo-print { display: none; }
        }
        @media print {
            body * { visibility: hidden; }
            .kds-recibo-print, .kds-recibo-print * { visibility: visible; }
            .kds-recibo-print {
                display: block;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
            }
            @page { margin: 6mm; }
        }
        .kds-recibo-print {
            width: 320px;
            margin: 0 auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            line-height: 1.45;
            color: #000;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .kds-recibo-logo {
            display: block;
            max-width: 120px;
            max-height: 90px;
            margin: 0 auto 6px;
        }

        /* ---------- MODO "TEXTO GRANDE" ---------- */
        .kds-zoom .kds-item-principal { font-size: 23px; }
        .kds-zoom .kds-item-detalhes { font-size: 17px; }
        .kds-zoom .kds-order-numero { font-size: 24px; }
        .kds-zoom .kds-btn-kitchen { font-size: 18px; padding: 18px; }

        @media (max-width: 640px) {
            .kds-topbar { padding: 10px 14px; }
            .kds-container { padding: 14px 14px 32px; }
            .kds-orders-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN DA COZINHA -->
    <div class="kds-login-screen" id="kitchenLoginScreen">
        <div class="kds-login-box">
            <img src="logo.png?v=1" alt="ArretadoGo" class="kds-logo">
            <p class="kds-login-subtitulo">🍳 Tela da Cozinha — só pedidos, sem acesso ao resto do painel</p>
            <form id="kitchenLoginForm">
                <div class="kds-form-group">
                    <label for="kEmail">E-mail</label>
                    <input type="email" id="kEmail" class="kds-input" required autocomplete="username">
                </div>
                <div class="kds-form-group">
                    <label for="kPassword">Senha</label>
                    <input type="password" id="kPassword" class="kds-input" required autocomplete="current-password">
                </div>
                <div id="kLoginError" class="kds-erro" style="display:none;"></div>
                <button type="submit" class="kds-btn kds-btn-primaria">Acessar Produção</button>
            </form>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL DA COZINHA -->
    <div class="kds-app" id="kitchenMain" style="display: none;">
        <header class="kds-topbar">
            <div class="kds-topbar-marca">
                <img src="logo.png?v=1" alt="ArretadoGo" class="kds-logo">
                <div>
                    <h1>Cozinha</h1>
                    <div class="kds-topbar-sub" id="kUserInfo">Conectado</div>
                </div>
            </div>
            <div class="kds-topbar-acoes">
                <span class="kds-chip" id="kdsRelogio">--:--</span>
                <button type="button" id="toggleZoomBtn" class="kds-btn-acao">🔍 Aumentar texto</button>
                <button type="button" id="kLogoutBtn" class="kds-btn-sair">🚪 Sair</button>
            </div>
        </header>

        <main class="kds-container">
            <div class="kds-toolbar">
                <h2>Pedidos em Produção</h2>
                <div class="kds-contador" id="activeCounter">0 pedidos ativos</div>
            </div>

            <div class="kds-orders-grid" id="kitchenOrdersGrid">
                <p style="color: var(--kds-texto-fraco); grid-column: 1/-1;">Carregando pedidos da cozinha...</p>
            </div>
        </main>
    </div>

    <!-- ÁREA DO RECIBO — invisível na tela, só aparece na hora de imprimir (ver CSS
         @media print acima). Preenchida dinamicamente por imprimirPedido(). -->
    <div class="kds-recibo-print" id="reciboImpressao"></div>

    <!-- LIBS DE INFRAESTRUTURA -->
    <script src="firebase-config.js"></script>
    <script src="pedido-status-utils.js"></script>

    <script>
        let pedidosCozinha = [];
        let zoomAtivo = false;
        let unsubscribePedidosCozinha = null;
        let intervalRelogio = null;
        let intervalRerenderTimers = null;
        let lojaInfoCozinha = { nome: 'ArretadoGo', logoUrl: '' };

        document.addEventListener('DOMContentLoaded', () => {
            inicializarLoginCozinha();
            verificarAutenticacaoCozinha();
            iniciarRelogio();

            document.getElementById('toggleZoomBtn').addEventListener('click', (e) => {
                zoomAtivo = !zoomAtivo;
                document.body.classList.toggle('kds-zoom', zoomAtivo);
                e.currentTarget.classList.toggle('kds-ativo', zoomAtivo);
            });
        });

        // Relógio no topo — referência rápida de horário pra bancada da cozinha,
        // sem precisar de outro dispositivo por perto.
        function iniciarRelogio() {
            const atualizar = () => {
                const agora = new Date();
                document.getElementById('kdsRelogio').textContent =
                    agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            };
            atualizar();
            if (intervalRelogio) clearInterval(intervalRelogio);
            intervalRelogio = setInterval(atualizar, 15000);
        }

        function inicializarLoginCozinha() {
            document.getElementById('kitchenLoginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('kEmail').value.trim();
                const senha = document.getElementById('kPassword').value;
                const errBox = document.getElementById('kLoginError');
                errBox.style.display = 'none';

                try {
                    await loginComEmailSenha(email, senha);
                    // onAuthStateChanged (verificarAutenticacaoCozinha) cuida do resto,
                    // inclusive de checar se esse login tem permissão de cozinha.
                } catch (err) {
                    errBox.textContent = 'E-mail ou senha inválidos.';
                    errBox.style.display = 'block';
                }
            });

            document.getElementById('kLogoutBtn').addEventListener('click', async () => {
                await logoutAdmin(); // mesmo signOut() usado em todo o resto do site
            });
        }

        async function verificarAutenticacaoCozinha() {
            const { auth } = await getFirebase();
            auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    pararEscutaPedidosCozinha();
                    document.getElementById('kitchenLoginScreen').style.display = 'flex';
                    document.getElementById('kitchenMain').style.display = 'none';
                    return;
                }

                // Cozinha vive dentro de UMA loja, mas isso não dá pra saber sem antes
                // achar o índice global uid -> lojaId (cozinha fica em subcoleção da
                // loja, não dá pra consultar sem já saber qual é a loja).
                let lojaId;
                try {
                    lojaId = await getCozinhaLojaId(user.uid);
                } catch (error) {
                    console.error('Erro ao checar loja da cozinha:', error);
                    mostrarErroLoginCozinha('Não foi possível confirmar seu acesso agora ' +
                        '(erro de conexão com o servidor). Tente de novo em instantes.');
                    return;
                }
                if (!lojaId) {
                    pararEscutaPedidosCozinha();
                    await auth.signOut();
                    mostrarErroLoginCozinha('Este acesso não está autorizado como cozinha, ou foi desativado.');
                    return;
                }
                definirLojaAtual(lojaId);

                const funcionario = await getCozinhaByUid(user.uid);
                if (!funcionario || funcionario.ativo === false) {
                    // Não é cadastro de cozinha, ou foi desativado: desloga e barra o acesso
                    pararEscutaPedidosCozinha();
                    await auth.signOut();
                    mostrarErroLoginCozinha('Este acesso não está autorizado como cozinha, ou foi desativado.');
                    return;
                }

                document.getElementById('kitchenLoginScreen').style.display = 'none';
                document.getElementById('kitchenMain').style.display = '';
                document.getElementById('kUserInfo').textContent = funcionario.nome || user.email;

                try {
                    const config = await getSettings();
                    lojaInfoCozinha = {
                        nome: (config && config.nome) || 'ArretadoGo',
                        logoUrl: (config && config.logoUrl) || ''
                    };
                } catch (error) {
                    console.error('Erro ao buscar dados da loja pro recibo:', error);
                }

                escutarPedidosCozinha();
            });
        }

        function mostrarErroLoginCozinha(mensagem) {
            document.getElementById('kitchenLoginScreen').style.display = 'flex';
            document.getElementById('kitchenMain').style.display = 'none';
            const errBox = document.getElementById('kLoginError');
            errBox.textContent = mensagem;
            errBox.style.display = 'block';
        }

        function escutarPedidosCozinha() {
            if (unsubscribePedidosCozinha) return; // já está escutando
            observarTodosPedidos((pedidos) => {
                // Filtra apenas pedidos relevantes para a Cozinha (Pendente ou Preparando)
                pedidosCozinha = pedidos.filter(p => p.status === 'pendente' || p.status === 'preparando');
                renderizarCozinha();
            }).then(unsub => { unsubscribePedidosCozinha = unsub; });

            // O tempo decorrido de cada pedido ("⏱️ X min") só era recalculado quando
            // um pedido novo chegava ou mudava de status — parecia "parado" entre uma
            // mudança e outra. Reaplica o mesmo render (sem bater no Firestore de novo)
            // a cada 30s só pra atualizar esses relógios na tela.
            if (intervalRerenderTimers) clearInterval(intervalRerenderTimers);
            intervalRerenderTimers = setInterval(() => {
                if (pedidosCozinha.length > 0) renderizarCozinha();
            }, 30000);
        }

        function pararEscutaPedidosCozinha() {
            if (unsubscribePedidosCozinha) {
                unsubscribePedidosCozinha();
                unsubscribePedidosCozinha = null;
            }
            if (intervalRerenderTimers) {
                clearInterval(intervalRerenderTimers);
                intervalRerenderTimers = null;
            }
        }

        function renderizarCozinha() {
            const grid = document.getElementById('kitchenOrdersGrid');
            const counter = document.getElementById('activeCounter');

            counter.textContent = `${pedidosCozinha.length} pedido(s) pendente(s)/em preparo`;

            if (pedidosCozinha.length === 0) {
                grid.innerHTML = '<div class="kds-vazio"><h3>🎉 Nenhum pedido na fila da cozinha!</h3></div>';
                return;
            }

            grid.innerHTML = '';

            // Ordena pedidos por horário (mais antigos primeiro)
            pedidosCozinha.sort((a, b) => {
                const dA = a.criadoEm?.toDate ? a.criadoEm.toDate() : new Date(a.criadoEm);
                const dB = b.criadoEm?.toDate ? b.criadoEm.toDate() : new Date(b.criadoEm);
                return dA - dB;
            });

            pedidosCozinha.forEach(pedido => {
                const card = document.createElement('div');
                const isPendente = pedido.status === 'pendente';
                card.className = `kds-card ${isPendente ? 'kds-status-pendente' : 'kds-status-preparando'}`;

                const dataCriacao = pedido.criadoEm?.toDate ? pedido.criadoEm.toDate() : new Date(pedido.criadoEm);
                const minutosDecorridos = Math.floor((new Date() - dataCriacao) / 60000);
                const tempoAlerta = minutosDecorridos > 20 ? 'kds-timer-alerta' : '';

                let itensHtml = '';
                if (Array.isArray(pedido.itens)) {
                    itensHtml = pedido.itens.map(item => {
                        let detalhes = '';
                        if (item.sabores && item.sabores.length > 0) {
                            detalhes += `<div>🍕 <strong>Sabores:</strong> ${escaparHtml(item.sabores.join(', '))}</div>`;
                        }
                        if (item.adicionais && item.adicionais.length > 0) {
                            detalhes += `<div>➕ <strong>Adicionais:</strong> ${escaparHtml(item.adicionais.map(a => a.nome || a).join(', '))}</div>`;
                        }

                        let obsHtml = item.observacoes ? `<div class="kds-item-obs">⚠️ OBS: ${escaparHtml(item.observacoes)}</div>` : '';

                        return `
                            <li class="kds-item-row">
                                <div class="kds-item-principal">
                                    <span class="kds-item-qtd">${item.quantidade}x</span>
                                    <span>${escaparHtml(item.nome)}</span>
                                </div>
                                ${(detalhes || obsHtml) ? `<div class="kds-item-detalhes">${detalhes}${obsHtml}</div>` : ''}
                            </li>
                        `;
                    }).join('');
                }

                card.innerHTML = `
                    <div class="kds-card-header">
                        <span class="kds-order-numero">#${escaparHtml(pedido.codigoPedido || pedido.id.substring(0, 8).toUpperCase())}</span>
                        <span class="kds-order-timer ${tempoAlerta}">⏱️ ${minutosDecorridos} min</span>
                    </div>
                    <div class="kds-card-body">
                        <span class="kds-tipo-badge ${pedido.tipoEntrega === 'delivery' ? 'kds-tipo-delivery' : 'kds-tipo-retirada'}">
                            ${pedido.tipoEntrega === 'delivery' ? '🚗 Entrega / Delivery' : '🏪 Retirada no Balcão'}
                        </span>
                        <ul class="kds-itens-lista">
                            ${itensHtml}
                        </ul>
                        ${pedido.observacoes ? `<div class="kds-item-obs" style="margin-top:10px;">📝 OBS GERAL: ${escaparHtml(pedido.observacoes)}</div>` : ''}
                    </div>
                    <div class="kds-card-footer">
                        <button class="kds-btn-imprimir" onclick="imprimirPedido('${pedido.id}')" title="Imprimir comanda">🖨️ Imprimir</button>
                        ${isPendente ?
                            `<button class="kds-btn-kitchen kds-btn-iniciar" onclick="alterarStatusCozinha('${pedido.id}', 'preparando')">👨‍🍳 Iniciar Preparo</button>` :
                            `<button class="kds-btn-kitchen kds-btn-pronto" onclick="alterarStatusCozinha('${pedido.id}', 'pronto')">✅ Pronto / Chamar Entrega</button>`
                        }
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        async function alterarStatusCozinha(pedidoId, novoStatus) {
            try {
                await updatePedidoStatus(pedidoId, novoStatus);
            } catch (err) {
                console.error('Erro ao atualizar status do pedido:', err);
                alert('Erro ao atualizar status do pedido: ' + traduzirErroFirebaseComum(err));
            }
        }

        // ========== IMPRESSÃO DA COMANDA ==========
        const RECIBO_LARGURA = 38; // colunas — largura típica de comanda 80mm

        function reciboLinha(char = '-') {
            return char.repeat(RECIBO_LARGURA);
        }

        function reciboCentralizado(texto) {
            texto = (texto || '').toUpperCase();
            if (texto.length >= RECIBO_LARGURA) return texto;
            const espacos = Math.floor((RECIBO_LARGURA - texto.length) / 2);
            return ' '.repeat(espacos) + texto;
        }

        // Alinha um rótulo à esquerda e um valor à direita, na mesma linha, preenchendo
        // o meio com espaço — é o "R$ 10,00" alinhado no canto direito da comanda.
        function reciboLinhaValor(rotulo, valor) {
            rotulo = rotulo || '';
            valor = valor || '';
            const espacoDisponivel = RECIBO_LARGURA - valor.length;
            if (rotulo.length >= espacoDisponivel) {
                return rotulo.slice(0, Math.max(0, espacoDisponivel - 1)) + ' ' + valor;
            }
            return rotulo + ' '.repeat(espacoDisponivel - rotulo.length) + valor;
        }

        function reciboMoeda(valor) {
            return 'R$ ' + (Number(valor) || 0).toFixed(2).replace('.', ',');
        }

        function reciboFormaPagamento(pedido) {
            const rotulos = { pix: 'Pix', credito: 'Cartão de Crédito', debito: 'Cartão de Débito', dinheiro: 'Dinheiro' };
            let texto = rotulos[pedido.formaPagamento] || pedido.formaPagamento || 'Não informado';
            if (pedido.formaPagamento === 'dinheiro' && pedido.trocoPara) {
                texto += ` (troco p/ R$ ${Number(pedido.trocoPara).toFixed(2).replace('.', ',')})`;
            }
            return texto;
        }

        function formatarDataHoraRecibo(data) {
            const d = data?.toDate ? data.toDate() : new Date(data);
            return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function montarTextoRecibo(pedido) {
            const linhas = [];
            const numero = pedido.codigoPedido || pedido.id.substring(0, 8).toUpperCase();

            linhas.push(reciboCentralizado(`**** PEDIDO #${numero} ****`));
            linhas.push('');
            linhas.push(reciboCentralizado(pedido.tipoEntrega === 'delivery' ? 'Delivery' : 'Retirada no Balcão'));
            linhas.push('');
            linhas.push(reciboCentralizado(lojaInfoCozinha.nome));
            linhas.push(`Data do Pedido: ${formatarDataHoraRecibo(pedido.criadoEm)}`);
            linhas.push('');
            linhas.push(`Cliente: ${pedido.nome || '-'}`);
            linhas.push(`Telefone: ${pedido.telefone || '-'}`);
            linhas.push(reciboLinha('-'));

            // ---- Itens ----
            linhas.push(reciboCentralizado('ITENS DO PEDIDO'));
            let subtotalItens = 0;
            (pedido.itens || []).forEach(item => {
                const totalItem = (item.preco || 0) * (item.quantidade || 1)
                    + (item.adicionais || []).reduce((s, a) => s + (a.preco || 0), 0) * (item.quantidade || 1);
                subtotalItens += totalItem;

                linhas.push(reciboLinhaValor(`${item.quantidade}x ${item.nome}`, reciboMoeda(totalItem)));
                if (item.sabores && item.sabores.length > 0) {
                    linhas.push(`   Sabores: ${item.sabores.join(', ')}`);
                }
                (item.adicionais || []).forEach(ad => {
                    linhas.push(`   + ${ad.nome || ad}`);
                });
                if (item.observacoes) {
                    linhas.push(`   Obs: ${item.observacoes}`);
                }
                linhas.push(reciboLinha('.'));
            });

            // ---- Total ----
            linhas.push('');
            linhas.push(reciboCentralizado('TOTAL'));
            linhas.push(reciboLinha('-'));
            linhas.push(reciboLinhaValor('Valor dos itens', reciboMoeda(subtotalItens)));
            if (pedido.taxaEntrega) {
                linhas.push(reciboLinhaValor('Taxa de Entrega', reciboMoeda(pedido.taxaEntrega)));
            }
            if (pedido.cupom) {
                linhas.push(reciboLinhaValor(`Desconto (${pedido.cupom.codigo})`, '- ' + reciboMoeda(pedido.cupom.economia)));
            }
            linhas.push(reciboLinha('-'));
            linhas.push(reciboLinhaValor('VALOR TOTAL', reciboMoeda(pedido.total)));
            linhas.push(reciboLinha('-'));
            linhas.push('');

            // ---- Pagamento ----
            linhas.push(reciboCentralizado('FORMA DE PAGAMENTO'));
            linhas.push(reciboFormaPagamento(pedido));
            linhas.push(reciboLinha('-'));

            if (pedido.observacoes) {
                linhas.push('');
                linhas.push('Observações do pedido:');
                linhas.push(pedido.observacoes);
                linhas.push(reciboLinha('-'));
            }

            // ---- Entrega ----
            if (pedido.tipoEntrega === 'delivery') {
                linhas.push('');
                linhas.push(reciboCentralizado(`ENTREGA PEDIDO #${numero}`));
                linhas.push('');
                linhas.push(`Cliente: ${pedido.nome || '-'}`);
                linhas.push(`Endereço: ${pedido.endereco || '-'}`);
                if (pedido.bairro) linhas.push(`Bairro: ${pedido.bairro}`);
                linhas.push(reciboLinha('-'));
            }

            linhas.push('');
            linhas.push(reciboCentralizado('Impresso por:'));
            linhas.push(reciboCentralizado(lojaInfoCozinha.nome + ' — ArretadoGo'));
            linhas.push(reciboCentralizado(formatarDataHoraRecibo(new Date())));

            return linhas.join('\n');
        }

        function imprimirPedido(pedidoId) {
            const pedido = pedidosCozinha.find(p => p.id === pedidoId);
            if (!pedido) {
                alert('Pedido não encontrado pra impressão.');
                return;
            }

            const container = document.getElementById('reciboImpressao');
            const logoHtml = lojaInfoCozinha.logoUrl
                ? `<img src="${escaparHtml(lojaInfoCozinha.logoUrl)}" alt="${escaparHtml(lojaInfoCozinha.nome)}" class="kds-recibo-logo">`
                : '';

            container.innerHTML = logoHtml + escaparHtml(montarTextoRecibo(pedido));

            // Espera o próximo frame pra garantir que a logo (se houver) já carregou
            // antes de mandar imprimir — senão a comanda pode sair sem a imagem.
            requestAnimationFrame(() => {
                window.print();
            });
        }
    </script>
