<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Motoboy - KitchGo</title>
    <link rel="icon" type="image/png" href="favicon.png?v=1">
    <link rel="icon" href="favicon.ico?v=1" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
    <link rel="stylesheet" href="admin-style.css?v=2">
    <style>
        .login-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(180deg, rgba(10,10,10,0.55) 0%, rgba(10,10,10,0.85) 60%, #0a0a0a 100%),
                url('https://rabiscoearte.github.io/MoldesClub/fastfood.png') center center / cover no-repeat;
            z-index: 9999;
        }
        .login-box {
            background: rgba(15, 15, 15, 0.82);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 44px 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .login-box h2 { margin: 0 0 8px; text-align: center; color: #fff; }
        .login-box p { margin: 0 0 24px; text-align: center; color: #b3b3b3; font-size: 14px; }
        .login-logo {
            display: block;
            max-width: 180px;
            width: 100%;
            height: auto;
            margin: 0 auto 20px;
        }
        .login-box .form-group label { color: #d9d9d9; font-size: 13px; font-weight: 600; }
        .login-box .input-field {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
        }
        .login-box .input-field::placeholder { color: #8a8a8a; }
        .login-box .input-field:focus {
            outline: none;
            border-color: var(--primary-color, #C20000);
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 3px rgba(194, 0, 0, 0.2);
        }
        .login-error {
            background: #fdecea;
            color: #b91c1c;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .motoboy-page {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px;
        }
        .motoboy-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .motoboy-header h1 { margin: 0; font-size: 22px; }
        .motoboy-header .user-info { color: #666; font-size: 13px; }

        /* ===== RESUMO ===== */
        .motoboy-resumo {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }
        .resumo-card {
            background: #fff;
            border-radius: 10px;
            padding: 14px 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 3px solid var(--primary-color, #C20000);
        }
        .resumo-card .resumo-valor {
            font-size: 22px;
            font-weight: 700;
            display: block;
            line-height: 1.2;
        }
        .resumo-card .resumo-label {
            font-size: 11px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ===== ABAS ===== */
        .motoboy-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 2px solid #eee;
        }
        .motoboy-tab {
            background: none;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s ease;
        }
        .motoboy-tab.active {
            color: var(--primary-color, #C20000);
            border-bottom-color: var(--primary-color, #C20000);
        }
        .motoboy-tab .tab-badge {
            background: #eee;
            color: #666;
            font-size: 11px;
            padding: 1px 7px;
            border-radius: 999px;
            margin-left: 6px;
        }
        .motoboy-tab.active .tab-badge {
            background: var(--primary-color, #C20000);
            color: #fff;
        }

        .entrega-card {
            background: #fff;
            border: 1px solid #eee;
            border-left: 4px solid #ccc;
            border-radius: 10px;
            padding: 16px 18px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .entrega-card.status-pendente { border-left-color: #999; }
        .entrega-card.status-preparando { border-left-color: #F39C12; }
        .entrega-card.status-saiu_entrega { border-left-color: #3498DB; }
        .entrega-card.status-entregue { border-left-color: #27AE60; opacity: 0.9; }
        .entrega-card .entrega-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .entrega-card .entrega-id { font-weight: 700; }
        .entrega-card .entrega-status {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 999px;
            font-weight: 600;
            background: #f1f1f1;
        }
        .entrega-card.status-pendente .entrega-status { background: #ececec; color: #555; }
        .entrega-card.status-preparando .entrega-status { background: #FDEBD0; color: #9C640C; }
        .entrega-card.status-saiu_entrega .entrega-status { background: #D6EAF8; color: #1A5276; }
        .entrega-card.status-entregue .entrega-status { background: #D4EDDA; color: #155724; }
        .entrega-card .entrega-detalhes { font-size: 14px; line-height: 1.6; color: #333; }
        .entrega-card .entrega-detalhes strong { color: #111; }
        .entrega-card .entrega-valor {
            font-weight: 700;
            color: var(--primary-color, #C20000);
        }
        .entrega-actions {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .entrega-actions .btn { flex: 1; min-width: 160px; }
        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: #999;
        }
    </style>
</head>
<body>
    <!-- TELA DE LOGIN -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <img src="logo.png?v=1" alt="KitchGo" class="login-logo">
            <p>Login de Motoboy</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">E-mail</label>
                    <input type="email" id="loginEmail" class="input-field" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Senha</label>
                    <input type="password" id="loginPassword" class="input-field" required autocomplete="current-password">
                </div>
                <div id="loginError" class="login-error" style="display:none;"></div>
                <button type="submit" class="btn btn-primary" style="width:100%;" id="loginSubmitBtn">Entrar</button>
            </form>
        </div>
    </div>

    <!-- PAINEL DO MOTOBOY -->
    <div class="motoboy-page" id="motoboyPage" style="display:none;">
        <div class="motoboy-header">
            <h1>🛵 Painel do Motoboy</h1>
            <div style="display:flex; align-items:center; gap:12px;">
                <span class="user-info" id="userInfo"></span>
                <button class="btn-logout" id="logoutBtn">Sair</button>
            </div>
        </div>

        <div class="motoboy-resumo">
            <div class="resumo-card">
                <span class="resumo-valor" id="resumoEmRota">—</span>
                <span class="resumo-label">Em Rota Agora</span>
            </div>
            <div class="resumo-card">
                <span class="resumo-valor" id="resumoHoje">—</span>
                <span class="resumo-label">Entregas Hoje</span>
            </div>
            <div class="resumo-card">
                <span class="resumo-valor" id="resumoTotal">—</span>
                <span class="resumo-label">Total de Entregas</span>
            </div>
        </div>

        <div class="motoboy-tabs">
            <button type="button" class="motoboy-tab active" id="tabAberto" data-tab="aberto">
                Em Aberto <span class="tab-badge" id="badgeAberto">0</span>
            </button>
            <button type="button" class="motoboy-tab" id="tabHistorico" data-tab="historico">
                Histórico
            </button>
        </div>

        <div id="entregasList">
            <div class="empty-state">Carregando entregas... ⏳</div>
        </div>

        <div id="historicoList" style="display:none;">
            <div class="empty-state">Carregando histórico... ⏳</div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script src="firebase-config.js"></script>
    <script src="pedido-status-utils.js"></script>
    <script src="motoboy.js"></script>
</body>
</html>
